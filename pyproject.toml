[project]
name = "divide-reader"
version = "0.1.0"
description = "Counts how many sides a text sorts its figures into, sentence by sentence."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Andrej Ristić" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "trafilatura>=1.12",
    "py3langid>=0.3",
    "pypdf>=4",
    "PySide6>=6.6",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
divide-reader = "divide_reader.cli:main"

[project.gui-scripts]
divide-reader-gui = "divide_reader.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divide_reader = ["templates/*", "data/*", "gui/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
